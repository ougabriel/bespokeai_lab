traffic_profiles:
  profiles:
    shadow-edge-drift:
      gateway_host: edge.shadow.internal.devops
      gateway_class: shared-edge
      route_prefix: /nebula
      propagation_header: x-release-track
      progressive_steps:
        - 25
        - 100
    mesh-prod-dr:
      gateway_host: edge.nebula-dr.internal.devops
      gateway_class: nebula-failover-mesh
      route_prefix: /nebula-relay
      propagation_header: x-nebula-corridor
      progressive_steps:
        - 10
        - 50
        - 100
