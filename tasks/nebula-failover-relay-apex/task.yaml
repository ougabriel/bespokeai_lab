id: nebula-failover-relay
prompt: |
  [Context]
  You are the DevOps engineer on call for `nebula-relay`.

  The lab is staged under `/app`. A control-region evacuation left the production failover relay inconsistent across CI, registry publish, GitOps promotion, resilience policy, observability, traffic, mesh, and telemetry.

  Everything you need is already in the environment. Work only from the seeded lab and the documentation bundled with the task.

  [Task]
  Repair the seeded source-of-truth so the active production failover relay works again.

  [Instructions]
  - Start with the incident docs under `/app/data/docs/`.
  - Derive the active production contract from the seeded lab and repair the seeded source-of-truth under `/app/data/lab_seed`.
  - Some production handoff manifests and helper inputs are intentionally missing or drifted. Create or repair them when the contract requires them.
  - A complete repair should survive bootstrap, the first failover rollout, and a second failover rollout on the same lane.
  - Repair the seeded files under `/app/data/lab_seed`.
  - Verify the repair by rerunning bootstrap and then running the two failover rollout commands back to back.

  [Notes]
  - Fix the release path itself. Do not hardcode the test commit SHAs into the API or CLI.
  - Do not modify the grader.
  - Do not replace the simulation with fake success responses.
  - Do not edit the control-plane implementation under `/app/app` or `/app/bin`.
  - Do not patch generated live state without fixing the seed. The next bootstrap or rollout will drift again if the source-of-truth is still wrong.

metadata:
  category: devops
  difficulty: very hard
